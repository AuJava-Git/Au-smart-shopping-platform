services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: smart_shop
    ports: ["3306:3306"]
    volumes: ["./database-smart_shop.sql:/docker-entrypoint-initdb.d/01-smart_shop.sql:ro", "./database-feature-migration.sql:/docker-entrypoint-initdb.d/02-feature.sql:ro"]
  redis:
    image: redis:7
    command: redis-server --requirepass 123321
    ports: ["6379:6379"]
  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports: ["8848:8848", "9848:9848"]
  namesrv:
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    ports: ["9876:9876"]
  broker:
    image: apache/rocketmq:5.3.1
    depends_on:
      - namesrv
    command: sh mqbroker -n namesrv:9876 autoCreateTopicEnable=true
    ports: ["10909:10909", "10911:10911"]
  sentinel:
    image: bladex/sentinel-dashboard:1.8.7
    ports: ["8858:8858"]
